    <script>
        function aparecerimagen() {
            const imagen = document.querySelector('#foto');
            const boton = document.querySelector('#btn');

            if (imagen.style.display === 'none') {
                imagen.style.display = 'block';
                boton.value = 'OCULTAR';
            } else {
                imagen.style.display = 'none';
                boton.value = 'MOSTRAR';
            }
        }
    </script>
</head>
